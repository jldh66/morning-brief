name: Morning Brief

on:
  # Schedule verwijderd 15/09/2026: GitHub-cron liep 4-6 uur te laat. De workflow wordt nu om 10:00 BE
  # gestart door de Cloudflare Worker "morning-brief-cron" (workflow_dispatch).
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance numpy pandas scikit-learn requests
          pip install -r requirements.txt
          pip install -e .

      - name: Run Morning Brief
        env:
          PYTHONIOENCODING: utf-8
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python morning_brief_cloud.py
